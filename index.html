<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="X-UA-Compatible" content="ie=edge" />
    <title>Furniture</title>
    <link rel="stylesheet" href="css/reset.css" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="container conteiner-header">
        <div class="header__inner">
          <img src="images/logo.svg" alt="Logo" />
          <div class="header__right">
            <nav class="menu">
              <ul class="menu__list">
                <li class="menu__item">
                  <a href="#" class="menu__link">Home</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">About us</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">Services</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">Blog</a>
                </li>
                <li class="menu__item">
                  <a href="#" class="menu__link">Contact us</a>
                </li>
              </ul>
            </nav>
            <div class="header__icon">
              <img src="images/contact.svg" alt="Contact" class="contact" />
              <img src="images/basket.svg" alt="Basket" class="basket" />
            </div>
          </div>
        </div>
      </div>
    </header>
    <section class="hero">
      <div class="container">
        <div class="hero__inner">
          <div class="hero__text">
            <h1 class="hero__title">"Transform your space with elegance."</h1>
            <button class="main__btn">Shop Now</button>
            <button class="main__btn">Explore</button>
          </div>
          <div class="hero__img">
            <picture>
              <source srcset="images/couch.webp" type="image/webp" />
              <img
                class="hero__img-main"
                src="images/couch.png"
                alt="green couch"
                width="810px"
              />
            </picture>
            <div class="hero-dekor"></div>
          </div>
        </div>
      </div>
    </section>
    <script src="js/main.js"></script>
  </body>
</html>
